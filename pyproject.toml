[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkscript"
version = "0.1.0"
description = "Ink as geometry, geometry as a font, the scanned page as native text."
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.26",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "google-genai>=1.0",
  "pypdfium2==5.12.1",   # pdfium 7947: reads RTL lines like Chrome 144 (7559); 5.13 (7999) does not
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
inkscript = "inkscript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
